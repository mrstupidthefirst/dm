<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cdemande Utilisateur</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#0a1628; --navy2:#0f1f3d; --accent:#e8a020; --text:#1a2540; --muted:#6b7a99; --light:#f4f6fa; --border:#d0d8e8; }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'IBM Plex Sans',sans-serif;background:var(--navy);min-height:100vh;padding:26px 14px}
        .box{max-width:900px;margin:0 auto;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 8px 36px rgba(0,0,0,.45)}
        .head{background:var(--navy2);border-bottom:3px solid var(--accent);padding:16px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center}
        .head a{color:var(--accent);text-decoration:none;font-size:12px;font-weight:700;text-transform:uppercase}
        .body{padding:22px}
        .flash{padding:10px;border-radius:3px;margin-bottom:10px;background:#d6f0e3;color:#1a6640}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:6px;font-weight:700}
        input,select{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:3px;background:var(--light)}
        .full{grid-column:1/-1}
        .btn{margin-top:12px;background:var(--accent);border:none;border-radius:3px;padding:11px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#0a1628;cursor:pointer}
        @media (max-width:780px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="box">
    <div class="head">
        <div>Nouvelle Cdemande</div>
        <a href="{{ url_for('user_dashboard') }}">Retour accueil</a>
    </div>
    <div class="body">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('user_cdemande') }}">
            <div class="grid">
                <div><label>Type</label><select name="type_val" required><option value="">Choisir</option><option value="personne_physique">Personne physique</option><option value="personne_morale">Personne morale</option><option value="transporteur">Transporteur</option><option value="tour_operateur">Tour operateur</option></select></div>
                <div><label>Entite d'accueil</label><select name="entite_accueil" required><option value="">Choisir</option><option value="terminal1">Terminal 1</option><option value="terminal2">Terminal 2</option><option value="douanes">Douanes</option><option value="transitaire">Transitaire</option></select></div>
                <div class="full"><label>Raison d'entree</label><input name="raison_entree" required></div>
                <div><label>Nom et Prenom</label><input name="nom_prenom" required></div>
                <div><label>Telephone</label><input name="telephone" required></div>
                <div><label>Piece d'identite</label><input name="piece_identite" required></div>
                <div><label>Date debut</label><input name="date_debut" type="date" required></div>
                <div><label>Date fin</label><input name="date_fin" type="date" required></div>
            </div>
            <button class="btn" type="submit">Envoyer la demande</button>
        </form>
    </div>
</div>
</body>
</html>
