<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Utilisateur - PortGate</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#0a1628; --navy2:#0f1f3d; --accent:#e8a020; --accent2:#d4901c; --text:#1a2540; --muted:#6b7a99; --light:#f4f6fa; --border:#d0d8e8; }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'IBM Plex Sans',sans-serif;background:var(--navy);min-height:100vh;color:#fff;background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.025) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.025) 40px)}
        .topbar{height:58px;background:var(--navy2);border-bottom:2px solid var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
        .topbar a{color:var(--accent);text-decoration:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
        .container{max-width:1000px;margin:34px auto;padding:0 18px}
        h1{font-size:24px}
        p{margin-top:6px;color:rgba(255,255,255,.5);font-family:'IBM Plex Mono',monospace;font-size:12px}
        .grid{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .card{background:#fff;color:var(--text);border-radius:4px;border-top:3px solid var(--accent);padding:24px;box-shadow:0 8px 34px rgba(0,0,0,.35)}
        .card h2{font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:#1a3a6e}
        .card .desc{margin-top:10px;color:var(--muted);font-size:14px;font-family:'IBM Plex Sans',sans-serif}
        .btn{margin-top:16px;display:inline-block;background:var(--accent);color:var(--navy);text-decoration:none;padding:10px 14px;border-radius:3px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
        .btn:hover{background:var(--accent2)}
        @media (max-width:780px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="topbar">
        <div>Utilisateur: {{ username }}</div>
        <a href="{{ url_for('logout') }}">Se deconnecter</a>
    </div>
    <div class="container">
        <h1>Espace utilisateur</h1>
        <p>Choisissez une action</p>
        <div class="grid">
            <div class="card">
                <h2>Nouvelle demande</h2>
                <div class="desc">Creer une nouvelle demande d'entree.</div>
                <a class="btn" href="{{ url_for('user_cdemande') }}">Aller au formulaire</a>
            </div>
            <div class="card">
                <h2>Mes demandes</h2>
                <div class="desc">Voir la liste de toutes vos demandes et leurs statuts.</div>
                <a class="btn" href="{{ url_for('user_demandes') }}">Voir la liste</a>
            </div>
        </div>
    </div>
</body>
</html>
